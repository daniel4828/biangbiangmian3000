<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="/static/nozoom.js?v=1"></script>
<title>Quick Dictionary</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<!-- Mac quick panel (#1510): loaded by the native app's WKWebView. Like /dict
     this page deliberately does NOT load app.js. -->
<link rel="stylesheet" href="/static/dict-result.css">
<style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --card:#fff; --fg:#1c1e21; --muted:#6b7075;
          --line:#d7d9dd; --accent:#c7871f; --ok:#1f7a44; --err:#a3232b; --bubble:#e9ecf1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --card:#232629; --fg:#e6e6e6; --muted:#9aa0a6;
            --line:#3a3d42; --ok:#6ed49b; --err:#ff9ba1; --bubble:#2f3338; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* #1520: input pinned to the bottom, messages scroll above it, the native
     panel grows upwards (its bottom edge is fixed). */
  body {
    padding: 12px; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); overflow: hidden;
  }
  #main {
    background: var(--card); border-radius: 14px; padding: 12px; height: 100%;
    display: flex; flex-direction: column;
  }
  .top { display: flex; align-items: center; gap: .4rem; margin-bottom: .6rem; flex: none; }
  .langs { display: flex; gap: .3rem; flex: none; }
  /* #1622: buttons never shrink or wrap (narrow panel squeezed 中文 into two
     lines); the shortcut hint takes the leftover space and truncates. */
  .langs button, button#new, button#hist, button#addw {
    flex: none; height: 1.9rem; padding: 0 .7rem; font: inherit; font-size: .82rem;
    font-weight: 600; line-height: 1; white-space: nowrap;
    color: var(--muted); background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer;
  }
  .langs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  button#hist { margin-left: .4rem; }
  #history { display: none; }
  #history .empty { color: var(--muted); padding: .6rem .2rem; }
  #history .row {
    display: flex; align-items: center; gap: .5rem; padding: .4rem .3rem;
    border-bottom: 1px solid var(--line); cursor: pointer;
  }
  #history .row:hover { background: var(--bubble); }
  #history .row .t { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #history .row .m { flex: none; font-size: .75rem; color: var(--muted); }
  #history .row button.del {
    flex: none; border: none; background: none; color: var(--muted); cursor: pointer;
    font: inherit; font-size: .85rem; padding: 0 .3rem;
  }
  #history .row button.del:hover { color: var(--err); }
  .kbd-hint {
    flex: 1 1 0; min-width: 0; text-align: right; font-size: .72rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  textarea#input {
    display: block; width: 100%; padding: .55rem .7rem; font: inherit; font-size: 1rem;
    color: inherit; resize: none; overflow-y: auto; line-height: 1.4;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  textarea#input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  textarea#input { flex: none; }
  #err { flex: none; margin-bottom: .5rem; font-size: .85rem; color: var(--err); white-space: pre-wrap; }
  #err:empty { display: none; }
  #messages { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  #log { padding-bottom: .2rem; }
  #log:empty { padding: 0; }
  /* Resize grips (native panel only): top edge = height, top corners = height + width. */
  .grip { position: fixed; z-index: 10; display: none; }
  body.native .grip { display: block; }
  .grip.top { top: 0; left: 14px; right: 14px; height: 7px; cursor: ns-resize; }
  .grip.topleft { top: 0; left: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  .grip.topright { top: 0; right: 0; width: 14px; height: 14px; cursor: nesw-resize; }
  .msg { margin-bottom: .6rem; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 85%; padding: .35rem .7rem; border-radius: 12px; background: var(--bubble);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.assistant .reply { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: .4rem; }
  .msg.assistant .reply:empty { display: none; }
  .msg.pending .reply { color: var(--muted); }
  .adds { font-size: .85rem; }
  .adds div { margin-top: .15rem; }
  .adds .err { color: var(--err); }
  .adds .ok { color: var(--ok); }
  .adds .run { color: var(--muted); }
  .entry:empty { display: none; }
</style>
</head>
<body>
<div id="main">
  <div class="top">
    <div class="langs" id="langs"></div>
    <button type="button" id="hist">Verlauf</button>
    <button type="button" id="addw" title="Direkt als Karte in die ★ List (⌘↵)">★ Karte</button>
    <button type="button" id="new">Neu</button>
    <span class="kbd-hint" title="⌘↵ Karte · Tab: Sprache wechseln · Shift+Tab: letzter Chat · ⌘Y Verlauf · ⌥⇧K">⌘↵ Karte · ⇥ Sprache · ⇧⇥ Letzter Chat · ⌘Y Verlauf · ⌥⇧K</span>
  </div>
  <div id="messages"><div id="log"></div><div id="history"></div></div>
  <div id="err"></div>
  <textarea id="input" rows="1" placeholder="Wort, Satz oder Frage…" autofocus
            autocapitalize="none" autocorrect="off" spellcheck="false"></textarea>
</div>
<div class="grip top" data-edge="top"></div>
<div class="grip topleft" data-edge="topleft"></div>
<div class="grip topright" data-edge="topright"></div>

<script src="/static/shared.js?v=9"></script>
<script>
  // Quick dictionary chat (#1510). Stateless server: the history lives here
  // and is sent with every turn. All AI text goes in via textContent.
  const inputEl = document.getElementById('input');
  const errEl = document.getElementById('err');
  const scrollerEl = document.getElementById('messages');
  const msgsEl = document.getElementById('log');
  const histEl = document.getElementById('history');
  const mainEl = document.getElementById('main');
  const langsEl = document.getElementById('langs');
  const LANG_LABELS = { zh: '中文', es: 'Español', fr: 'Français' };

  let lang = 'zh';
  try { lang = localStorage.getItem('quickLang') || 'zh'; } catch (e) { /* storage unavailable */ }
  let history = [];  // [{role, content}]
  let turns = [];    // finished turns, stored server-side as the chat history (#1584)
  let chatId = null; // quick_chats id of this conversation (null = not saved yet)
  let previousChat = null; // most recently left conversation, including its draft
  let busy = false;
  let historyOpen = false;

  const bridge = () => (window.webkit && window.webkit.messageHandlers
                        && window.webkit.messageHandlers.quick) || null;
  function post(msg) { const b = bridge(); if (b) b.postMessage(msg); }
  // Natural height = everything around the scroller + the messages' own height.
  // #main is stretched to the viewport, so measuring it alone could never shrink.
  // Measure the fixed parts one by one: #main's own height is clamped by a panel
  // that opens too small, and would keep reporting that small size forever.
  function outerHeight(el) {
    const h = el.getBoundingClientRect().height;
    if (!h) return 0;
    const cs = getComputedStyle(el);
    return h + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
  }
  function reportHeight() {
    const cs = getComputedStyle(document.body);
    const ms = getComputedStyle(mainEl);
    const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom)
              + parseFloat(ms.paddingTop) + parseFloat(ms.paddingBottom);
    const chrome = outerHeight(mainEl.querySelector('.top')) + outerHeight(errEl) + outerHeight(inputEl);
    const body = historyOpen ? histEl : msgsEl;
    post({ type: 'height', value: Math.ceil(pad + chrome + body.getBoundingClientRect().height) });
  }
  // The newest question stays at the top of the scroller while its answer grows
  // below it, so a long answer is read from its start (not scrolled to its end).
  // If everything fits, the clamp makes this the same as the bottom.
  let anchorEl = null;
  function stickToBottom() {
    if (anchorEl && anchorEl.isConnected) {
      scrollerEl.scrollTop += anchorEl.getBoundingClientRect().top
                              - scrollerEl.getBoundingClientRect().top;
    } else {
      scrollerEl.scrollTop = scrollerEl.scrollHeight;
    }
  }
  const resizeObs = new ResizeObserver(() => { reportHeight(); if (!historyOpen) stickToBottom(); });
  resizeObs.observe(msgsEl);
  resizeObs.observe(histEl);
  window.addEventListener('resize', stickToBottom);
  if (bridge()) {
    document.body.classList.add('native');
    for (const g of document.querySelectorAll('.grip')) {
      g.addEventListener('mousedown', e => {
        e.preventDefault();
        post({ type: 'resizeStart', edge: g.dataset.edge });
      });
    }
  }

  function setLang(l) {
    lang = l;
    try { localStorage.setItem('quickLang', l); } catch (e) { /* ignore */ }
    post({ type: 'lang', value: l });  // native app keeps a copy (survives a cleared WebKit store)
    for (const b of langsEl.children) b.classList.toggle('active', b.dataset.lang === l);
  }
  function renderLangButtons(langs) {
    langsEl.replaceChildren(...langs.map(l => {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.lang = l;
      b.textContent = LANG_LABELS[l] || l;
      b.onclick = () => setLang(l);
      return b;
    }));
    if (!langs.includes(lang)) lang = langs.includes('zh') ? 'zh' : langs[0];
    setLang(lang);
  }
  // Native app restores the last used language after load (see QuickPanel.swift).
  window.quickSetLang = l => {
    if ([...langsEl.children].some(b => b.dataset.lang === l)) setLang(l);
    else lang = l;  // buttons from /api/langs not there yet; renderLangButtons applies it
  };
  // Tab: next language.
  function cycleLang(step) {
    const codes = [...langsEl.children].map(b => b.dataset.lang);
    if (!codes.length) return;
    const i = codes.indexOf(lang);
    setLang(codes[(i + step + codes.length) % codes.length]);
  }
  renderLangButtons(['zh', 'es', 'fr']);
  api('GET', '/api/langs?available=1').then(l => {
    if (Array.isArray(l) && l.length) renderLangButtons(l);
  }).catch(() => { /* keep the defaults */ });

  function autosize() {
    inputEl.style.height = 'auto';
    const cs = getComputedStyle(inputEl);
    const line = parseFloat(cs.lineHeight) || 20;
    const pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + 2;
    const max = line * 6 + pad;
    inputEl.style.height = Math.min(inputEl.scrollHeight, max) + 'px';
    reportHeight();
  }
  inputEl.addEventListener('input', autosize);
  autosize();

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function scrollToNewest() {
    reportHeight();
    stickToBottom();
  }

  function addWordStatus(container, word, wlang) {
    const line = el('div', 'run', `★ ${word} …`);
    container.append(line);
    addWordViaAi(word, 'list', (state, text) => {
      if (state === 'running') { line.className = 'run'; line.textContent = `★ ${word} … ${text || ''}`; }
      else if (state === 'done') { line.className = 'ok'; line.textContent = `✓ ${word} hinzugefügt${text ? ' — ' + text : ''}`; }
      else if (state === 'error') { line.className = 'err'; line.textContent = `⚠ ${word}: ${text}`; }
      else if (state === 'idle') { line.className = 'run'; line.textContent = `${word}: abgebrochen`; }
      scrollToNewest();
    }, wlang);
  }

  // One finished turn -> [user bubble, assistant block]. `live` = a fresh turn:
  // start the add-word jobs; restored turns (live=false) only list what was added.
  function renderTurn(turn, live) {
    const userMsg = el('div', 'msg user');
    userMsg.append(el('div', 'bubble', turn.user));
    const done = el('div', 'msg assistant');
    done.append(el('div', 'reply', turn.reply || ''));
    if (turn.entry) {
      const box = el('div', 'entry');
      renderDictResult(box, { id: turn.entry_id, query: turn.user, lang: turn.lang, result: turn.entry },
                       { addLang: turn.lang });
      done.append(box);
    }
    if (Array.isArray(turn.add) && turn.add.length) {
      const adds = el('div', 'adds');
      done.append(adds);
      for (const w of turn.add) {
        if (live) addWordStatus(adds, w, turn.lang);
        else adds.append(el('div', 'ok', `★ ${w}`));
      }
    }
    return [userMsg, done];
  }

  // Persist the whole conversation; a failure must never interrupt the chat.
  async function saveChat() {
    try {
      const res = await api('PUT', '/api/quick-chats', { id: chatId, lang, turns });
      chatId = res.id;
    } catch (e) {
      errEl.textContent = 'Verlauf nicht gespeichert: ' + (e.message || e);
    }
  }

  function closeHistory() {
    historyOpen = false;
    histEl.style.display = 'none';
    msgsEl.style.display = '';
    histEl.replaceChildren();
    reportHeight();
    stickToBottom();
  }
  async function openHistory() {
    if (busy) return;
    historyOpen = true;
    msgsEl.style.display = 'none';
    histEl.style.display = 'block';
    histEl.replaceChildren(el('div', 'empty', '…'));
    reportHeight();
    try {
      const res = await api('GET', '/api/quick-chats');
      if (!historyOpen) return;
      const items = res.items || [];
      if (!items.length) {
        histEl.replaceChildren(el('div', 'empty', 'Noch keine Chats'));
      } else {
        histEl.replaceChildren(...items.map(it => {
          const row = el('div', 'row');
          row.append(el('span', 't', it.title || '(ohne Titel)'),
                     el('span', 'm', `${LANG_LABELS[it.lang] || it.lang} · ${(it.updated_at || '').slice(5, 16)}`));
          const del = el('button', 'del', '✕');
          del.type = 'button';
          del.onclick = async e => {
            e.stopPropagation();
            try {
              await api('DELETE', `/api/quick-chats/${it.id}`);
              row.remove();
              if (it.id === chatId) chatId = null;
              if (it.id === previousChat?.id) previousChat = null;
              if (!histEl.children.length) histEl.replaceChildren(el('div', 'empty', 'Noch keine Chats'));
              reportHeight();
            } catch (err) {
              errEl.textContent = err.message || 'Fehler';
            }
          };
          row.append(del);
          row.onclick = () => restoreChat(it.id);
          return row;
        }));
      }
    } catch (e) {
      histEl.replaceChildren(el('div', 'empty', 'Fehler: ' + (e.message || e)));
    }
    reportHeight();
  }
  function rememberChat() {
    if (turns.length) previousChat = { id: chatId, lang, turns, draft: inputEl.value };
  }

  async function restoreChat(id) {
    if (busy) return;
    busy = true;
    try {
      let chat;
      if (id == null && previousChat) {
        chat = previousChat;
      } else {
        if (id == null) {
          const { items } = await api('GET', '/api/quick-chats');
          id = items?.find(item => item.id !== chatId)?.id;
          if (id == null) return;
        }
        chat = await api('GET', `/api/quick-chats/${id}`);
      }
      const sameChat = chat.id != null && chat.id === chatId;
      const draft = sameChat || !turns.length ? inputEl.value : '';
      if (chat === previousChat) previousChat = null;
      if (!sameChat) rememberChat();
      chatId = chat.id;
      turns = Array.isArray(chat.turns) ? chat.turns : [];
      history = turns.flatMap(t => [
        { role: 'user', content: t.user },
        { role: 'assistant', content: t.history_text || t.reply || '' },
      ]);
      if ([...langsEl.children].some(b => b.dataset.lang === chat.lang)) setLang(chat.lang);
      msgsEl.replaceChildren();
      anchorEl = null;
      for (const t of turns) {
        const [u, a] = renderTurn(t, false);
        msgsEl.append(u, a);
        anchorEl = u;
      }
      errEl.textContent = '';
      closeHistory();
      inputEl.value = draft || chat.draft || '';
      autosize();
      inputEl.focus();
    } catch (e) {
      errEl.textContent = e.message || 'Fehler';
    } finally {
      busy = false;
    }
  }
  function toggleHistory() {
    if (historyOpen) closeHistory();
    else openHistory();
  }
  document.getElementById('hist').onclick = toggleHistory;

  async function send() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    if (historyOpen) closeHistory();
    busy = true;
    errEl.textContent = '';
    const turnLang = lang;

    const userMsg = el('div', 'msg user');
    userMsg.append(el('div', 'bubble', text));
    const pending = el('div', 'msg assistant pending');
    pending.append(el('div', 'reply', '…'));
    msgsEl.append(userMsg, pending);
    anchorEl = userMsg;
    scrollToNewest();
    inputEl.value = '';
    autosize();

    // Streamed (#1524): the reply text and a pending entry paint as they arrive;
    // the final render below replaces them with the validated, stored answer.
    const liveReply = pending.querySelector('.reply');
    const liveEntry = el('div', 'entry');
    pending.append(liveEntry);
    const onPartial = partial => {
      if (typeof partial.reply === 'string' && partial.reply) {
        pending.classList.remove('pending');
        liveReply.textContent = partial.reply;
      }
      if (partial.entry && typeof partial.entry === 'object') {
        pending.classList.remove('pending');
        if (liveReply.textContent === '…') liveReply.textContent = '';
        renderDictResult(liveEntry, { query: text, lang: turnLang, result: partial.entry },
                         { addLang: turnLang, pending: true });
      }
      scrollToNewest();
    };

    try {
      const data = await dictChatStream({
        messages: [...history, { role: 'user', content: text }],
        lang: turnLang,
      }, onPartial);
      const turn = {
        user: text, reply: data.reply || '', entry: data.entry || null,
        entry_id: data.id || null, add: data.add || [],
        history_text: data.history_text || data.reply || '', lang: turnLang,
      };
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: turn.history_text });
      turns.push(turn);

      pending.replaceWith(renderTurn(turn, true)[1]);
      await saveChat();
    } catch (e) {
      // Keep any follow-up draft, and show which question failed.
      const hasDraft = inputEl.value.length > 0;
      if (!hasDraft) inputEl.value = text;
      autosize();
      anchorEl = null;
      userMsg.remove();
      pending.remove();
      const error = e.message || 'Fehler';
      errEl.textContent = hasDraft ? `${error}\nNicht gesendet: ${text}` : error;
    } finally {
      busy = false;
      scrollToNewest();
    }
  }

  // Direkt hinzufügen ohne Nachschlagen: geht durch dieselbe Pipeline (#643).
  function addDirect() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    if (historyOpen) closeHistory();
    errEl.textContent = '';
    const words = text.split(/[\n,，、]+/).map(w => w.trim()).filter(Boolean).slice(0, 20);
    const userMsg = el('div', 'msg user');
    userMsg.append(el('div', 'bubble', '★ ' + words.join(', ')));
    const box = el('div', 'msg assistant');
    const adds = el('div', 'adds');
    box.append(adds);
    msgsEl.append(userMsg, box);
    anchorEl = userMsg;
    for (const w of words) addWordStatus(adds, w, lang);
    inputEl.value = '';
    autosize();
    inputEl.focus();
    scrollToNewest();
  }
  document.getElementById('addw').onclick = addDirect;

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.isComposing && !e.metaKey && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      if (e.shiftKey) {
        if (!e.repeat) restoreChat();
      } else cycleLang(1);
      return;
    }
    if (e.key === 'Enter' && e.metaKey && !e.isComposing) {
      e.preventDefault();
      addDirect();
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  // A reply still in flight would land in the new chat, so wait for it.
  function newChat() {
    if (busy) return;
    rememberChat();
    history = [];
    turns = [];
    chatId = null;
    if (historyOpen) closeHistory();
    anchorEl = null;
    msgsEl.replaceChildren();
    errEl.textContent = '';
    inputEl.value = '';
    autosize();
    inputEl.focus();
  }
  document.getElementById('new').onclick = newChat;
  // Mac app: fresh chat on every open (#1543, menu „Beim Öffnen neuer Chat“).
  window.quickNewChat = newChat;

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (historyOpen) closeHistory();
      else post({ type: 'close' });
    } else if (e.metaKey && !e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      toggleHistory();
    }
  });

  function focusInput() {
    inputEl.focus();
    inputEl.select();
  }
  window.quickFocus = focusInput;
  window.addEventListener('focus', focusInput);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') focusInput();
  });
  focusInput();
</script>
</body>
</html>
