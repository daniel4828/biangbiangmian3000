<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add word</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/logo.svg">
<!-- Saved to the iPhone home screen this opens without Safari's chrome (#668). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Add word">
<meta name="theme-color" content="#4a90d9">
<style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --card:#fff; --fg:#1c1e21; --muted:#6b7075;
          --line:#d7d9dd; --accent:#4a90d9; --ok:#1f7a44; --err:#a3232b;
          --ok-bg:#e6f4ec; --err-bg:#fdecee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --card:#232629; --fg:#e6e6e6; --muted:#9aa0a6;
            --line:#3a3d42; --ok:#6ed49b; --err:#ff9ba1;
            --ok-bg:#1d3328; --err-bg:#3a2326; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  main { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.25rem; }
  h1 { margin: 0; font-size: 1.15rem; }
  header a { color: var(--muted); font-size: .85rem; text-decoration: none; }
  .card { padding: 1rem; border-radius: 14px; background: var(--card); }
  .row { display: flex; gap: .5rem; }
  input[type=text] {
    flex: 1; min-width: 0; padding: .8rem;
    font-size: 1.25rem; color: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  button.go {
    padding: .8rem 1.2rem; font-size: 1.05rem; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
  }
  button.go:disabled { opacity: .5; }
  ul { list-style: none; margin: 1rem 0 0; padding: 0; }
  li {
    display: flex; align-items: baseline; gap: .6rem;
    padding: .6rem .8rem; margin-bottom: .4rem; border-radius: 10px;
    background: var(--card); font-size: .9rem;
  }
  li .word { font-size: 1.1rem; font-weight: 600; }
  li .msg { color: var(--muted); overflow-wrap: anywhere; }
  li.done { background: var(--ok-bg); } li.done .msg { color: var(--ok); }
  li.error { background: var(--err-bg); } li.error .msg { color: var(--err); }
  .hint { margin: .8rem 0 0; font-size: .8rem; color: var(--muted); }
  /* Language picker (#726) — hidden until /api/langs says more than one
     language is in use, so a Chinese-only install looks exactly as before. */
  .langs { display: none; gap: .4rem; margin-bottom: .7rem; }
  .langs button {
    padding: .35rem .9rem; font: inherit; font-size: .85rem; font-weight: 600;
    color: var(--muted); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  .langs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Add word</h1>
    <a href="/">← app</a>
  </header>

  <div class="card">
    <div class="langs" id="langs"></div>
    <div class="row">
      <input type="text" id="word" placeholder="中文生词" autocomplete="off"
             autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" autofocus>
      <button class="go" id="go">加</button>
    </div>
    <p class="hint" id="hint">Parked in your ★ List — generated in full, but not reviewed until you add it to a deck from Browse.</p>
  </div>

  <ul id="queue"></ul>
</main>

<script src="/static/shared.js?v=5"></script>
<script>
  // Standalone quick-add page (#668). Deliberately does NOT load app.js: the
  // point is a link that opens instantly on the phone. All the real work goes
  // through addWordViaAi() in shared.js — the single add-word pipeline (#643).
  // Where an added word goes (#715): the ★ List, always. Adding a word no
  // longer drops it straight into a review queue — it is staged in Saved
  // (suspended) and activated later from Browse, deliberately.
  //
  // The day is still a parameter of the API and of this page's URL, so the
  // iOS Shortcuts Daniel already built (/add?word=X&day=today) keep behaving
  // the way they did. There is simply no button for it any more.
  let day = 'list';
  const items = [];   // newest first
  const input = document.getElementById('word');
  const queue = document.getElementById('queue');

  const DAYS = ['today', 'tomorrow', 'list'];

  // Language of the next word (#726). Chinese unless ?lang= or the picker says
  // otherwise; the backend rejects the wrong script, so the placeholder has to
  // say which language the box currently expects.
  let lang = 'zh';
  const LANG_LABELS = { zh: '中文', fr: 'Français', es: 'Español' };
  const PLACEHOLDERS = { zh: '中文生词', fr: 'nouveau mot', es: 'palabra nueva' };

  function setLang(l) {
    lang = l;
    input.placeholder = PLACEHOLDERS[l] || l;
    for (const b of document.getElementById('langs').children) {
      b.classList.toggle('active', b.dataset.lang === l);
    }
    input.focus();
  }

  // The picker needs to know which languages exist, which only the server
  // knows. One tiny request, fired after first paint — this page's whole point
  // is opening instantly, so nothing waits on it. A ?lang= URL still works
  // even if the request fails.
  async function loadLangs() {
    let langs;
    try {
      langs = await api('GET', '/api/langs?available=1');
    } catch { return; }
    if (!langs || !langs.length) return;
    // A ?lang= naming a language this install doesn't use falls back to zh
    // rather than sending the server something it will reject.
    if (!langs.includes(lang)) setLang('zh');
    if (langs.length <= 1) return;
    const el = document.getElementById('langs');
    el.replaceChildren(...langs.map(l => {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.lang = l;
      b.textContent = LANG_LABELS[l] || l;
      b.onclick = () => setLang(l);
      return b;
    }));
    el.style.display = 'flex';
    setLang(langs.includes(lang) ? lang : 'zh');
  }

  function render() {
    queue.replaceChildren(...items.map(it => {
      const li = document.createElement('li');
      li.className = it.state;
      const w = document.createElement('span');
      w.className = 'word';
      w.textContent = it.wordZh;
      const m = document.createElement('span');
      m.className = 'msg';
      m.textContent = it.text;
      li.append(w, m);
      return li;
    }));
  }

  function submit() {
    const wordZh = input.value.trim();
    if (!wordZh) return;
    // Clear immediately — the whole point is being able to queue the next word
    // while this one generates in the background.
    input.value = '';
    input.focus();

    const item = { wordZh, state: 'running', text: 'Generating…' };
    items.unshift(item);
    render();

    addWordViaAi(wordZh, day, (state, text) => {
      // 'idle' (#888): the user cancelled the "already in your collection"
      // confirmation, so nothing happened — drop the queued entry entirely
      // rather than leaving it stuck on "Generating…".
      if (state === 'idle') {
        const idx = items.indexOf(item);
        if (idx !== -1) items.splice(idx, 1);
        render();
        return;
      }
      item.state = state;
      item.text = text;
      render();
    }, lang);
  }

  document.getElementById('go').onclick = submit;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

  // URL parameters (#686) — /add?word=生态&day=today — so an iOS Shortcut can
  // add a word straight from any app. `day` is optional and defaults to the
  // ★ List (#715); an unknown value falls back to it rather than failing,
  // since the word is the part that matters.
  //
  // Opening such a link submits immediately and therefore spends an AI call.
  // That is the whole point of the parameter, but it also means the word is
  // stripped from the address bar afterwards (history.replaceState): a reload
  // or a "restore tabs" on the phone would otherwise silently add it again.
  //
  // ?lang=fr (#726) picks the language, so Daniel can keep one Shortcut per
  // language. An unknown value is ignored the same way an unknown day is —
  // the server would reject it, and the word is what matters.
  const params = new URLSearchParams(location.search);
  const preset = (params.get('word') || params.get('w') || '').trim();
  const dayParam = (params.get('day') || '').trim();
  const langParam = (params.get('lang') || '').trim();
  if (DAYS.includes(dayParam)) day = dayParam;
  if (langParam) setLang(langParam);
  loadLangs();
  if (preset) {
    input.value = preset;
    history.replaceState(null, '', location.pathname);
    submit();
  }
</script>
</body>
</html>
