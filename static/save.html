<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Save material</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/logo.svg">
<!-- Saved to the iPhone home screen this opens without Safari's chrome (#681). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Save">
<meta name="theme-color" content="#6366f1">
<style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --card:#fff; --fg:#1c1e21; --muted:#6b7075;
          --line:#d7d9dd; --accent:#6366f1; --ok:#1f7a44; --err:#a3232b;
          --ok-bg:#e6f4ec; --err-bg:#fdecee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --card:#232629; --fg:#e6e6e6; --muted:#9aa0a6;
            --line:#3a3d42; --ok:#6ed49b; --err:#ff9ba1;
            --ok-bg:#1d3328; --err-bg:#3a2326; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 1.5rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg);
  }
  main { max-width: 480px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1.25rem; }
  h1 { margin: 0; font-size: 1.15rem; }
  header a { color: var(--muted); font-size: .85rem; text-decoration: none; }
  .card { padding: 1rem; border-radius: 14px; background: var(--card); }
  .tabs { display: flex; gap: .4rem; margin-bottom: .9rem; }
  .tabs button {
    flex: 1; padding: .55rem; font-size: .95rem; color: var(--muted);
    background: transparent; border: 1px solid var(--line); border-radius: 8px; cursor: pointer;
  }
  .tabs button[aria-pressed=true] { color: #fff; background: var(--accent); border-color: var(--accent); }
  input[type=text], textarea {
    display: block; width: 100%; padding: .75rem;
    /* iOS zooms the page in when a focused field is under 16px */
    font: inherit; font-size: 1rem; color: inherit;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
  textarea { min-height: 9rem; resize: vertical; margin-top: .5rem; }
  button.go {
    width: 100%; padding: .8rem; margin-top: .6rem;
    font-size: 1.05rem; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer;
  }
  button.go:active { filter: brightness(.92); }
  ul { list-style: none; margin: 1rem 0 0; padding: 0; }
  li {
    padding: .6rem .8rem; margin-bottom: .4rem; border-radius: 10px;
    background: var(--card); font-size: .9rem;
  }
  li .what { display: block; font-weight: 600; overflow-wrap: anywhere; }
  li .msg { color: var(--muted); overflow-wrap: anywhere; }
  li.done { background: var(--ok-bg); } li.done .msg { color: var(--ok); }
  li.error { background: var(--err-bg); } li.error .msg { color: var(--err); }
  .hint { margin: .8rem 0 0; font-size: .8rem; color: var(--muted); }
  .china { display: flex; align-items: center; gap: .5rem; margin-top: .8rem;
           font-size: .85rem; color: var(--muted); cursor: pointer; }
  .china input { width: 1.1rem; height: 1.1rem; margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Save material</h1>
    <a href="/">← app</a>
  </header>

  <div class="card">
    <div class="tabs">
      <button id="tab-link" aria-pressed="true">🔗 Link</button>
      <button id="tab-text" aria-pressed="false">📋 Text</button>
      <button id="tab-file" aria-pressed="false">📎 File</button>
    </div>

    <div id="pane-link">
      <input type="text" id="url" placeholder="Paste an article, YouTube or Instagram Reel link…"
             inputmode="url" autocomplete="off" autocapitalize="none"
             autocorrect="off" spellcheck="false" enterkeyhint="done" autofocus>
      <!-- #1054: YouTube audiobooks have no caption track at all — this
           routes the link to downloading the audio and queueing local ASR
           transcription instead. Only meaningful for YouTube links. -->
      <label class="china"><input type="checkbox" id="audiobook">
        audiobook — download audio and queue for transcription (YouTube only)</label>
      <button class="go" id="go-link">Add</button>
    </div>

    <div id="pane-text" style="display:none">
      <textarea id="text" placeholder="Paste the article body…" style="margin-top:0"></textarea>
      <!-- #833: all optional. Whatever is left blank the server reads out of
           the pasted body itself with one cheap AI call, so on the phone the
           usual move is "paste the text, hit Add" and nothing else. -->
      <input type="text" id="source-url" placeholder="Original link (optional)"
             inputmode="url" autocomplete="off" autocapitalize="none"
             autocorrect="off" spellcheck="false" style="margin-top:.5rem">
      <input type="text" id="title" placeholder="Title (optional — read from the text)"
             autocomplete="off" style="margin-top:.5rem">
      <input type="text" id="author" placeholder="Author (optional — read from the text)"
             autocomplete="off" style="margin-top:.5rem">
      <button class="go" id="go-text">Add</button>
    </div>

    <!-- #835: .txt / .md / .pdf / .docx go through the very same
         ingest_text() the paste box uses; only the source differs. #1068:
         .mp3 / .m4a / .wav are a different shape of material (no text yet,
         they get queued for transcription) but share this tab and this file
         picker since it's the same gesture ("I have a file"). -->
    <div id="pane-file" style="display:none">
      <input type="file" id="file" accept=".txt,.md,.markdown,.pdf,.docx,.mp3,.m4a,.wav">
      <input type="text" id="file-source-url" placeholder="Original link (optional)"
             inputmode="url" autocomplete="off" autocapitalize="none"
             autocorrect="off" spellcheck="false" style="margin-top:.5rem">
      <input type="text" id="file-title" placeholder="Title (optional — filename is used)"
             autocomplete="off" style="margin-top:.5rem">
      <input type="text" id="file-author" placeholder="Author (optional — read from the text)"
             autocomplete="off" style="margin-top:.5rem">
      <button class="go" id="go-file">Add</button>
    </div>

    <!-- #731: DeepSeek waters down China-critical material without saying so,
         so this flag makes the server's API summary fallback use GPT instead.
         Shared by both tabs and cleared after every submit — the cheap model
         is right for almost everything, and a sticky box would quietly spend
         GPT money on all of it. -->
    <label class="china"><input type="checkbox" id="china"> china-kritisch — summarize with GPT</label>

    <p class="hint" id="hint">Transcription and the Chinese + German summary run on the
      server — you can close this page, it keeps going.</p>
  </div>

  <ul id="queue"></ul>
</main>

<script src="/static/shared.js?v=5"></script>
<script>
  // Standalone knowledge-base page (#681), the /add counterpart for material.
  // Deliberately does NOT load app.js — the point is a link that opens
  // instantly on the phone when sharing an article from another app. All the
  // real work goes through ingestKnowledge() in shared.js, so this page and
  // the app's Knowledge tab can never drift apart.
  const items = [];   // newest first
  const queue = document.getElementById('queue');
  const url = document.getElementById('url');
  const title = document.getElementById('title');
  const author = document.getElementById('author');
  const sourceUrl = document.getElementById('source-url');
  const text = document.getElementById('text');

  const TABS = ['link', 'text', 'file'];
  const FOCUS = { link: url, text: text, file: null };
  for (const t of TABS) {
    document.getElementById(`tab-${t}`).onclick = () => {
      for (const other of TABS) {
        document.getElementById(`tab-${other}`).setAttribute('aria-pressed', String(other === t));
        document.getElementById(`pane-${other}`).style.display = other === t ? '' : 'none';
      }
      // The file picker gets no autofocus — focusing it does nothing useful
      // and on iOS can pop the picker open unasked.
      FOCUS[t]?.focus();
    };
  }

  function render() {
    queue.replaceChildren(...items.map(it => {
      const li = document.createElement('li');
      li.className = it.state;
      const w = document.createElement('span');
      w.className = 'what';
      w.textContent = it.what;
      const m = document.createElement('span');
      m.className = 'msg';
      m.textContent = it.text;
      li.append(w, m);
      return li;
    }));
  }

  const china = document.getElementById('china');
  const audiobook = document.getElementById('audiobook');

  // ingestKnowledge()'s confirmFn (#1054): this page is deliberately
  // self-contained (no app.js), so a plain native confirm() is the "existing
  // prompting style" here rather than pulling in a second modal system.
  async function confirmLongAudiobook(res) {
    const hours = res.duration_seconds != null ? (res.duration_seconds / 3600).toFixed(1) : null;
    const length = hours ? `${hours}h long` : 'of unknown length';
    return confirm(
      `"${res.title || 'This video'}" is ${length} — downloading its audio and ` +
      `transcribing it can take a long time and a few hundred MB of disk space. Continue?`
    );
  }

  async function submit(payload, what, confirmFn) {
    // Clear immediately — the next link can be pasted while this one runs.
    const item = { what, state: 'running', text: 'Adding…' };
    items.unshift(item);
    render();
    try {
      const res = await ingestKnowledge(payload, confirmFn);
      if (res?.status === 'cancelled') {
        item.state = 'done';
        item.text = 'Cancelled.';
        render();
        return;
      }
      item.state = 'done';
      item.text = res?.status === 'already_exists'
        ? 'Already in your library.'
        : res?.queued
          ? '✓ added — audio downloaded, queued for transcription'
          : '✓ added — processing on the server';
    } catch (e) {
      // Paywalled/JS-only pages fail extraction on purpose rather than storing
      // a stub; the Text tab is the way out, so point at it.
      item.state = 'error';
      item.text = (e.message || 'Failed') + ' — try the 📋 Text tab.';
    }
    render();
  }

  document.getElementById('go-link').onclick = () => {
    const v = url.value.trim();
    if (!v) return;
    const as_audiobook = audiobook.checked;
    url.value = '';
    url.focus();
    submit({ url: v, china_critical: china.checked, as_audiobook },
            v, as_audiobook ? confirmLongAudiobook : undefined);
    china.checked = false;
    audiobook.checked = false;
  };
  url.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('go-link').click();
  });

  document.getElementById('go-text').onclick = () => {
    const body = text.value.trim();
    if (!body) return;
    const payload = {
      text: body,
      title: title.value.trim(),
      author: author.value.trim(),
      source_url: sourceUrl.value.trim(),
      china_critical: china.checked,
    };
    // The queue line needs a label right now, before the server has told us
    // what it read out of the text — first line of the body is the honest
    // stand-in for "the thing I just pasted".
    const label = payload.title || body.split('\n').map(l => l.trim()).find(l => l) || 'Pasted text';
    for (const el of [title, author, sourceUrl, text]) el.value = '';
    text.focus();
    submit(payload, label);
    china.checked = false;
  };

  // #1068: audio files skip text extraction entirely (there is no text yet
  // — that's what the queued transcription produces) and go through
  // ingestKnowledgeAudio() instead, which also reports upload progress —
  // a several-hundred-MB audiobook with no feedback looks exactly like a
  // hang.
  const AUDIO_EXTS = ['.mp3', '.m4a', '.wav'];
  function isAudioFile(name) {
    const lower = (name || '').toLowerCase();
    return AUDIO_EXTS.some(ext => lower.endsWith(ext));
  }

  const fileInput = document.getElementById('file');
  document.getElementById('go-file').onclick = async () => {
    const f = fileInput.files?.[0];
    if (!f) return;
    const fields = {
      title: document.getElementById('file-title').value.trim(),
      author: document.getElementById('file-author').value.trim(),
      source_url: document.getElementById('file-source-url').value.trim(),
      china_critical: china.checked,
    };
    const item = { what: f.name, state: 'running', text: 'Uploading…' };
    items.unshift(item);
    render();
    for (const id of ['file-title', 'file-author', 'file-source-url']) {
      document.getElementById(id).value = '';
    }
    fileInput.value = '';
    china.checked = false;
    try {
      let res;
      if (isAudioFile(f.name)) {
        // No source_url field on the audio path — an uploaded recording has
        // no "original link", so fields.source_url is simply ignored there.
        res = await ingestKnowledgeAudio(f, fields, (frac) => {
          item.text = `Uploading… ${Math.round(frac * 100)}%`;
          render();
        });
        item.state = 'done';
        item.text = res?.status === 'already_exists'
          ? 'Already in your library.'
          : '✓ uploaded — queued for transcription';
      } else {
        res = await ingestKnowledgeFile(f, fields);
        item.state = 'done';
        item.text = res?.status === 'already_exists'
          ? 'Already in your library.'
          : '✓ added — processing on the server';
      }
    } catch (e) {
      item.state = 'error';
      item.text = e.message || 'Failed';
    }
    render();
  };
</script>
</body>
</html>
